services:
  fpm:
    container_name: pca-fpm
    image: $CI_REGISTRY_IMAGE:php-fpm-${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - /opt/projetos/pca/.env
      # - /opt/projetos/pca/.env.dev
    networks:
      - traefik-pca

  nginx:
    container_name: pca-nginx
    image: $CI_REGISTRY_IMAGE:nginx-${IMAGE_TAG:-latest}
    restart: unless-stopped
    networks:
      - traefik-pca
    labels:
      - "traefik.enable=true"

      - "traefik.http.routers.d-pca-http.rule=Host(`d-congex.tce.mt.gov.br`)"
      - "traefik.http.routers.d-pca-http.entrypoints=http"
      - "traefik.http.routers.d-pca-http.middlewares=redirect-to-https"

      - "traefik.http.routers.d-pca-https.rule=Host(`d-congex.tce.mt.gov.br`)"
      - "traefik.http.routers.d-pca-https.entrypoints=https"
      - "traefik.http.routers.d-pca-https.tls=true"

      - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.permanent=true"
    depends_on:
      fpm:
        condition: service_started

networks:
  traefik-pca:
    external: true
